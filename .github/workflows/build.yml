name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # needed to create a release on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer reads the version from git tags (see Directory.Build.props)

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test Tests/Drs.Unreal.Common.Tests -c Release

      - name: Publish UETestTool.exe
        run: dotnet publish Tools/UETestTool -c Release -o publish/UETestTool

      - name: Check the exe's version matches the tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $expected = '${{ github.ref_name }}'.TrimStart('v')
          $actual = (Get-Item publish/UETestTool/UETestTool.exe).VersionInfo.ProductVersion.Split('+')[0]
          if ($actual -ne $expected) { throw "UETestTool.exe is version '$actual', expected '$expected' from the tag." }
          "UETestTool.exe version $actual"

      - uses: actions/upload-artifact@v4
        with:
          name: UETestTool
          path: publish/UETestTool/UETestTool.exe

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' publish/UETestTool/UETestTool.exe --title "UE Test Tool ${{ github.ref_name }}" --generate-notes
